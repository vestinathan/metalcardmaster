  // ---- Logo généré pour les groupes sans asset réel (photo/logo) ----
  // Pas d'API musicale ni d'images téléversées : on génère un logo SVG (typographie stylisée +
  // palette dérivée du style musical), encodé en data URI, utilisable partout où card.logo est
  // attendu (header, holo légendaire) sans dépendance externe ni action manuelle par groupe.
  var GENRE_HOLO = {
    "Black Metal": ["#8aa8c9", "#1c2a3d", "#c9d6e8"],
    "Black Metal Symph.": ["#7a6bb8", "#241a3d", "#b79bdc"],
    "Black/Death Metal": ["#8b1e2a", "#1a0a0a", "#d94f4f"],
    "Death Metal": ["#7a9c3e", "#1a2208", "#b9d96a"],
    "Thrash Metal": ["#d9c23e", "#2a2206", "#f0e07a"],
    "Thrash/Black Metal": ["#c98a3e", "#241a08", "#e8b96a"],
    "Heavy Metal": ["#c9a227", "#2a2008", "#e8cf6a"],
    "Gothic Metal": ["#8a3e6b", "#22081a", "#c97aa8"],
    "Power Metal": ["#3e7ac9", "#081a2a", "#7ab0e8"]
  };
  function genreHolo(genre) {
    return GENRE_HOLO[genre] || ["#b8975a", "#241f14", "#e0c48a"];
  }
  function genBandLogo(card) {
    var colors = genreHolo(card.genre);
    var main = colors[0];
    var isBlack = /Black/.test(card.genre);
    var isDeath = /Death/.test(card.genre);
    var isGothic = /Gothic/.test(card.genre);
    var font = (isBlack || isGothic) ? "'Vina Sans', cursive" : "'Anton', sans-serif";
    var skew = isBlack || isDeath ? -6 : 0;
    var letterSpacing = isBlack ? 3 : 1;
    var name = card.name.toUpperCase();
    // viewBox large et fixe (1000x200) ; taille de police calée sur la longueur du nom pour
    // toujours tenir dans ~960px de large (marge de 20px de chaque côté), quel que soit le nom
    // du groupe — évite tout débordement hors cadre comme un vrai logo texte.
    // ratio largeur/hauteur approx. pour Anton/Vina Sans en majuscules : chaque caractère occupe
    // environ 0.78x la taille de police en largeur (polices condensées mais hautes), + l'espacement
    // des lettres cumulé sur toute la longueur du nom.
    var avgCharW = 0.78;
    var fontSize = Math.floor(880 / (name.length * avgCharW + letterSpacing * name.length / 10));
    fontSize = Math.max(20, Math.min(80, fontSize));
    // width/height explicites (en plus du viewBox) : sans eux, certains moteurs de rendu donnent
    // une boîte intrinsèque nulle à l'image une fois contrainte par "width:auto" en flexbox.
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">' +
      '<text x="500" y="128" text-anchor="middle" font-family="' + font + '" font-size="' + fontSize + '" ' +
      'fill="' + main + '" letter-spacing="' + letterSpacing + '" ' +
      'transform="skewX(' + skew + ')">' + name + '</text>' +
      '</svg>';
    return "data:image/svg+xml," + encodeURIComponent(svg);
  }
  // pose directement --holo-a/b/c depuis la palette du genre (pas besoin d'extraction canvas :
  // la couleur est connue par construction, contrairement à une vraie image de logo).
  function applyGeneratedHolo(el, card) {
    var colors = genreHolo(card.genre);
    el.style.setProperty("--holo-a", colors[0]);
    el.style.setProperty("--holo-b", colors[1]);
    el.style.setProperty("--holo-c", colors[2]);
    el.classList.add("holo-from-logo");
  }

  var RARITY_LABEL = {
    commune: "Commune", rare: "Rare", super_rare: "Super Rare",
    ultra_rare: "Ultra Rare", legendaire: "Légendaire"
  };

  // ---- Photos/logos de groupe ----
  // Images téléchargées une fois via TheAudioDB (photo de groupe posée + logo vectoriel, repli
  // Wikipedia si introuvable) et stockées localement dans images/bands/ : pas d'appel réseau au
  // runtime, pas de dépendance à la disponibilité d'une API externe au moment où quelqu'un ouvre
  // l'app. Pour un groupe sans image trouvée (ex: trop confidentiel), card.photo/card.logo
  // restent absents et le fallback généré (cf. genBandLogo plus haut) prend le relais normalement.

  var ownedIds = loadOwned();

  function loadOwned() {
    try {
      var raw = localStorage.getItem("grimoire-owned");
      return raw ? JSON.parse(raw) : ["metallica", "mayhem", "drowningthelight", "blacksabbath", "dimmuborgir"];
    } catch (e) { return ["metallica", "mayhem", "drowningthelight", "blacksabbath", "dimmuborgir"]; }
  }
  function saveOwned() {
    try { localStorage.setItem("grimoire-owned", JSON.stringify(ownedIds)); } catch (e) {}
  }

  // ---- Tabs ----
  var tabBtns = document.querySelectorAll(".tab-btn");
  var views = { album: document.getElementById("view-album"), packs: document.getElementById("view-packs") };
  tabBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      tabBtns.forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      Object.keys(views).forEach(function (k) { views[k].hidden = (k !== btn.dataset.view); });
    });
  });

  // ---- Filters ----
  var FILTERS = ["Tous", "Légendaire", "Ultra Rare", "Super Rare", "Rare", "Commune"];
  var rarityKeyByLabel = {
    "Légendaire": "legendaire", "Ultra Rare": "ultra_rare", "Super Rare": "super_rare",
    "Rare": "rare", "Commune": "commune"
  };
  var activeFilter = "Tous";
  var filtersEl = document.getElementById("filters");
  var filterChips = {};

  function filterCount(f) {
    if (f === "Tous") return CARDS.length;
    var key = rarityKeyByLabel[f];
    return CARDS.filter(function (c) { return c.rarity === key; }).length;
  }

  FILTERS.forEach(function (f) {
    var chip = document.createElement("button");
    chip.className = "chip" + (f === "Tous" ? " active" : "");
    chip.textContent = f + " (" + filterCount(f) + ")";
    chip.addEventListener("click", function () {
      activeFilter = f;
      filtersEl.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
      chip.classList.add("active");
      renderGrid();
    });
    filterChips[f] = chip;
    filtersEl.appendChild(chip);
  });

  // ---- Grid render ----
  var gridEl = document.getElementById("grid");

  // Remplit un slot .mini-card avec son vrai contenu (image, logo, relief metallicss). Appelé
  // seulement quand le slot entre dans le viewport (cf. IntersectionObserver plus bas) : avec
  // 235 cartes, chaque carte "metallicss" génère son propre filtre SVG + MutationObserver +
  // ResizeObserver (cf. initMetallicss plus bas dans le fichier), ce qui, multiplié par 235
  // d'un coup, faisait planter Safari mobile en scrollant (mémoire/GPU). On ne paie donc ce
  // coût que pour les cartes réellement visibles à un instant donné.
  function populateMiniCard(el, c) {
    if (el.dataset.populated) return;
    el.dataset.populated = "1";
    var owned = ownedIds.indexOf(c.id) !== -1;
    el.className = "mini-card" + (owned ? " metallicss" : " locked");
    el.dataset.rarity = c.rarity;
    var initials = c.name.split(" ").map(function (w) { return w[0]; }).slice(0, 2).join("");
    // meme garde-fou de chargement que sur la reveal-card : une image distante (Wikipedia) peut
    // echouer cote navigateur ; onerror (attache plus bas, apres l'injection du HTML) bascule
    // alors sur les initiales plutot que l'icone "image cassee".
    var artHtml = (owned && c.photo)
      ? '<img class="mc-art-img" src="' + c.photo + '" alt="" loading="lazy" decoding="async"><div class="mc-art-tint"></div>'
      : (owned ? initials : "?");
    // meme composition que le header de la reveal-card : badge de rarete + logo du groupe
    var logoHtml = (owned && c.logo)
      ? '<img class="mc-logo" src="' + c.logo + '" alt="' + c.name + '" loading="lazy" decoding="async">'
      : "";
    var badgeHtml = owned ? '<div class="mc-rarity-badge metallicss">' + RARITY_LABEL[c.rarity] + '</div>' : '<div class="mc-rarity-badge">' + RARITY_LABEL[c.rarity] + '</div>';
    el.innerHTML =
      '<div class="mc-window">' +
        '<div class="mc-head">' + badgeHtml + logoHtml + '</div>' +
        '<div class="mc-art">' + artHtml + '</div>' +
        '<div class="mc-plate"><span class="mc-name">' + (owned ? c.name : "???") + '</span></div>' +
      '</div>';
    var artImgEl = el.querySelector(".mc-art-img");
    if (artImgEl) {
      artImgEl.addEventListener("error", function () {
        var artContainer = el.querySelector(".mc-art");
        if (artContainer) artContainer.innerHTML = initials;
      }, { once: true });
    }
    var logoImgElGrid = el.querySelector(".mc-logo");
    if (logoImgElGrid) {
      logoImgElGrid.addEventListener("error", function () {
        logoImgElGrid.remove();
      }, { once: true });
    }
    // La lib metallicss ne scanne ".metallicss" qu'au chargement de la page (DOMContentLoaded) ;
    // elle ne détecte pas les éléments créés/peuplés dynamiquement ensuite. On l'appelle donc
    // nous-mêmes sur cette carte précise, si elle a bien chargé (cf. script en fin de fichier).
    if (window.applyMetallicss) {
      el.querySelectorAll(".metallicss").forEach(window.applyMetallicss);
    }
    if (owned) {
      el.addEventListener("click", function () { openCardZoom(c); });
    }
  }

  // ---- Vue agrandie d'une carte depuis la collection (meme design que l'ouverture de pack,
  // via buildRevealCard) : clic sur une mini-card possedee -> fiche TCG plein ecran. ----
  var cardZoom = document.getElementById("cardZoom");
  var cardZoomStage = document.getElementById("cardZoomStage");
  var closeCardZoomBtn = document.getElementById("closeCardZoom");

  function openCardZoom(card) {
    cardZoomStage.innerHTML = "";
    // onTap no-op : en vue collection il n'y a pas de "carte suivante", un tap/clic ne fait rien
    // (seul le drag-tilt reste actif) ; la fermeture passe par le bouton ou le fond.
    var el = buildRevealCard(card, function () {});
    cardZoomStage.appendChild(el);
    if (window.applyMetallicss) {
      el.querySelectorAll(".metallicss").forEach(window.applyMetallicss);
    }
    cardZoom.hidden = false;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { el.classList.add("showing"); });
    });
  }

  function closeCardZoom() {
    cardZoom.hidden = true;
    cardZoomStage.innerHTML = "";
  }

  closeCardZoomBtn.addEventListener("click", closeCardZoom);
  cardZoom.addEventListener("click", function (e) {
    if (e.target === cardZoom) closeCardZoom();
  });

  var gridObserver = (typeof IntersectionObserver !== "undefined")
    ? new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            populateMiniCard(entry.target, entry.target._card);
          }
        });
      }, { root: null, rootMargin: "800px 0px", threshold: 0 })
    : null;

  function renderGrid() {
    if (gridObserver) gridObserver.disconnect();
    gridEl.innerHTML = "";
    var list = CARDS.filter(function (c) {
      if (activeFilter === "Tous") return true;
      return c.rarity === rarityKeyByLabel[activeFilter];
    });
    list.forEach(function (c) {
      // slot vide au départ (pas d'image, pas de relief metallicss, pas d'observers) : seule sa
      // taille (aspect-ratio en CSS) compte pour que le scroll ait tout de suite la bonne
      // hauteur. Le vrai contenu n'est injecté que quand le slot approche du viewport.
      var el = document.createElement("div");
      el.className = "mini-card mini-card-slot";
      el.dataset.rarity = c.rarity;
      el._card = c;
      gridEl.appendChild(el);
      if (gridObserver) {
        gridObserver.observe(el);
      } else {
        // pas d'IntersectionObserver disponible (très vieux navigateur) : on retombe sur
        // l'ancien comportement, tout peuplé d'un coup.
        populateMiniCard(el, c);
      }
    });
  }

  renderGrid();

  // ---- Reflet chromé interactif : la surbrillance mobile des bandes (--holo-x, posée en
  // CSS sur .booster-body/.pack-closed) suit le pointeur horizontalement, comme sur la
  // maquette validée. S'applique à l'étagère ET au paquet en cours d'ouverture. ----
  (function initHoloShimmer() {
    function bind(el) {
      if (!el || el.dataset.holoBound) return;
      el.dataset.holoBound = "1";
      el.addEventListener("pointermove", function (e) {
        var rect = el.getBoundingClientRect();
        var px = (e.clientX - rect.left) / rect.width;
        px = Math.max(0, Math.min(1, px));
        el.style.setProperty("--holo-x", (px * 100).toFixed(1) + "%");
      });
      el.addEventListener("pointerleave", function () {
        el.style.removeProperty("--holo-x");
      });
    }
    document.querySelectorAll(".booster").forEach(bind);
    var packClosedEl = document.getElementById("packClosed");
    if (packClosedEl) bind(packClosedEl);
  })();

  // ---- Pack opening sequence ----
  var opening = document.getElementById("opening");
  var stage = document.getElementById("stage");
  var packClosed = document.getElementById("packClosed");
  var tearFlash = document.getElementById("tearFlash");
  var tapHint = document.getElementById("tapHint");
  var progressEl = document.getElementById("openingProgress");
  var closeBtn = document.getElementById("closeOpening");

  var PACK_SIZE = 5;
  var pullQueue = [];
  var pullIndex = -1;
  var revealEls = [];

  // packKind : "daily" (ou absent) pioche dans tout CARDS comme avant ; "musicians" restreint
  // le tirage aux cartes type==="musician" uniquement, pour un paquet dédié aux artistes.
  function pickPack(packKind) {
    var rarityWeight = { commune: 0, rare: 1, super_rare: 2, ultra_rare: 3, legendaire: 4 };
    var pool = packKind === "musicians"
      ? CARDS.filter(function (c) { return c.type === "musician"; })
      : CARDS.slice();
    var pulled = [];
    for (var i = 0; i < PACK_SIZE; i++) {
      pulled.push(pool[Math.floor(Math.random() * pool.length)]);
    }
    pulled.sort(function (a, b) { return rarityWeight[a.rarity] - rarityWeight[b.rarity]; });
    return pulled;
  }

  document.querySelectorAll(".booster").forEach(function (btn) {
    btn.addEventListener("click", function () {
      if (btn.disabled) return;
      startOpening(btn);
    });
  });

  // Reprend l'habillage (édition, logo, mention "N cartes") du booster cliqué sur l'étagère,
  // pour que .pack-closed affiche toujours le même alliage/contenu que le paquet ouvert —
  // rien n'est codé en dur ici, tout vient du DOM du booster source. data-pack détermine le
  // pool de tirage (cf. pickPack).
  function startOpening(sourceBtn) {
    pullQueue = pickPack(sourceBtn && sourceBtn.dataset.pack);
    pullIndex = -1;
    opening.hidden = false;
    var edition = (sourceBtn && sourceBtn.dataset.edition) || "legend";
    packClosed.dataset.edition = edition;
    tapHint.hidden = true;
    closeBtn.hidden = true;
    progressEl.hidden = false;
    progressEl.innerHTML = "";
    pullQueue.forEach(function () {
      var dot = document.createElement("div");
      dot.className = "op-dot";
      progressEl.appendChild(dot);
    });
    revealEls.forEach(function (el) { el.remove(); });
    revealEls = [];

    // Visuel plein cadre (packshot déjà habillé, logo/illustration/texte inclus dans l'image) :
    // pas d'écran "pack fermé" ni de geste de déchirure pour ce mode, le clic ouvre directement
    // le tirage de cartes — cf. .booster-full-art.
    var fullArtImg = sourceBtn ? sourceBtn.querySelector(".booster-full-art img") : null;
    if (fullArtImg) {
      packClosed.hidden = true;
      nextCard();
      return;
    }

    packClosed.hidden = false;
    packClosed.classList.remove("tearing-done", "snapping");
    var brandImg = sourceBtn ? sourceBtn.querySelector(".booster-brand-mark img") : null;
    var editionLabel = sourceBtn ? sourceBtn.querySelector(".booster-edition") : null;
    var countLabel = sourceBtn ? sourceBtn.querySelector(".booster-count") : null;
    var artImg = sourceBtn ? sourceBtn.querySelector(".booster-art img") : null;
    packClosed.innerHTML =
      (brandImg ? '<div class="pc-brand-mark"><img src="' + brandImg.src + '" alt="' + brandImg.alt + '"></div>' : "") +
      (countLabel ? '<span class="pc-count">' + countLabel.textContent + '</span>' : "") +
      (artImg ? '<div class="pc-art"><img src="' + artImg.src + '" alt="' + artImg.alt + '"></div>' : "") +
      (editionLabel ? '<div class="pc-edition">' + editionLabel.textContent + '</div>' : "") +
      '<div class="pc-mark">Glisser pour déchirer</div>' +
      '<div class="pc-tear-zone" id="pcTearZone">' +
        '<div class="pc-tear-hint">↔</div>' +
        '<div class="pc-tear-line"></div>' +
      '</div>';
    initTearGesture();
  }

  // ---- Geste de déchirure : glisser horizontalement sur la bande pointillée pour décoller le
  // haut du booster, comme sur Pokémon TCG Pocket. Le haut suit le doigt en continu (translation
  // + légère rotation + fondu) ; au-delà d'un seuil de progression, l'ouverture se termine
  // automatiquement, sinon le haut revient se recoller ("snap back"). ----
  var TEAR_THRESHOLD = 0.55; // fraction de la largeur du paquet à parcourir pour déclencher l'ouverture
  var tearDragging = false, tearStartX = 0, tearPackTop = null, tearWidth = 1;

  function initTearGesture() {
    var zone = document.getElementById("pcTearZone");
    if (!zone) return;
    zone.addEventListener("pointerdown", onTearStart);
  }

  function onTearStart(e) {
    if (tearDragging) return;
    tearDragging = true;
    tearStartX = e.clientX;
    tearWidth = packClosed.getBoundingClientRect().width || 1;
    packClosed.classList.remove("snapping");

    // construit les deux moitiés au moment du premier contact, pour que le drag les anime
    var topHalf = document.createElement("div");
    topHalf.className = "pc-half pc-top";
    var bottomHalf = document.createElement("div");
    bottomHalf.className = "pc-half pc-bottom";
    packClosed.innerHTML = "";
    packClosed.appendChild(bottomHalf);
    packClosed.appendChild(topHalf);
    tearPackTop = topHalf;

    try { e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); } catch (err) {}
    window.addEventListener("pointermove", onTearMove);
    window.addEventListener("pointerup", onTearEnd);
    window.addEventListener("pointercancel", onTearEnd);
  }

  function onTearMove(e) {
    if (!tearDragging || !tearPackTop) return;
    var dx = e.clientX - tearStartX;
    var dir = dx >= 0 ? 1 : -1;
    var progress = Math.min(1, Math.abs(dx) / (tearWidth * TEAR_THRESHOLD));
    var slide = dx; // le haut suit le doigt 1:1, dans les deux sens
    var lift = progress * 26; // se soulève légèrement en se décollant
    var rotate = dir * progress * 14;
    var fade = 1 - progress * 0.7;
    tearPackTop.style.transform = "translate(" + slide + "px, " + (-lift) + "px) rotate(" + rotate + "deg)";
    tearPackTop.style.opacity = String(fade);
    tearPackTop.dataset.progress = String(progress);
  }

  function onTearEnd() {
    if (!tearDragging) return;
    tearDragging = false;
    window.removeEventListener("pointermove", onTearMove);
    window.removeEventListener("pointerup", onTearEnd);
    window.removeEventListener("pointercancel", onTearEnd);
    var progress = tearPackTop ? parseFloat(tearPackTop.dataset.progress || "0") : 0;
    if (progress >= 1) {
      finishTear();
    } else if (tearPackTop) {
      // pas assez loin : le haut revient se recoller à sa place
      packClosed.classList.add("snapping");
      tearPackTop.style.transform = "translate(0px, 0px) rotate(0deg)";
      tearPackTop.style.opacity = "1";
    }
  }

  function finishTear() {
    // retire le style inline posé pendant le drag : la classe tearing-done prend le relais avec
    // sa propre transition CSS (.4s) vers la position finale, en partant visuellement de là où
    // le doigt l'a lâché (le navigateur interpole depuis le style calculé actuel).
    if (tearPackTop) {
      tearPackTop.style.transform = "";
      tearPackTop.style.opacity = "";
    }
    packClosed.classList.add("tearing-done");
    tearFlash.classList.add("flashing");
    setTimeout(function () {
      packClosed.hidden = true;
      tearFlash.classList.remove("flashing");
      nextCard();
    }, 420);
  }

  function nextCard() {
    pullIndex++;
    updateProgressDots();
    if (pullIndex >= pullQueue.length) {
      tapHint.hidden = true;
      closeBtn.hidden = false;
      pullQueue.forEach(function (c) {
        if (ownedIds.indexOf(c.id) === -1) ownedIds.push(c.id);
      });
      saveOwned();
      renderGrid();
      return;
    }
    var card = pullQueue[pullIndex];
    var el = buildRevealCard(card);
    stage.appendChild(el);
    revealEls.push(el);
    if (window.applyMetallicss) {
      el.querySelectorAll(".metallicss").forEach(window.applyMetallicss);
    }
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { el.classList.add("showing"); });
    });
    tapHint.hidden = false;
  }

  // extrait 2 teintes vibrantes dominantes du logo du groupe (quand il existe) pour teinter le
  // holo des cartes Légendaires avec les couleurs propres au groupe plutôt qu'un arc-en-ciel
  // générique ; échantillonnage canvas, en ignorant les pixels quasi noir/blanc/gris (fonds et
  // contours de logo) pour ne garder que les teintes réellement colorées. Pose --holo-a/--holo-b
  // sur la carte ; si rien d'assez saturé n'est trouvé (logo N&B) ou si ça échoue, on ne pose
  // rien et le CSS retombe sur sa palette dorée par défaut.
  function applyLogoHolo(el, card) {
    // pas de logo reel (asset photo) : palette du genre posee directement, pas d'extraction
    // canvas necessaire puisque le logo genere est construit depuis cette meme palette.
    if (!card.logo) { applyGeneratedHolo(el, card); return; }
    var img = new Image();
    // pas de crossOrigin="anonymous" : l'asset est servi en same-origin (images/bands/...), et
    // forcer une requête CORS anonyme dessus peut au contraire faire échouer le chargement selon
    // les en-têtes renvoyés — on charge l'image normalement, comme pour .rc-head-logo.
    img.onload = function () {
      try {
        var cv = document.createElement("canvas");
        var w = (cv.width = 64), h = (cv.height = 64);
        var ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        var data = ctx.getImageData(0, 0, w, h).data;
        var buckets = {};
        for (var i = 0; i < data.length; i += 4) {
          var r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
          if (a < 128) continue;
          var max = Math.max(r, g, b), min = Math.min(r, g, b);
          var light = (max + min) / 2;
          var sat = max === min ? 0 : (max - min) / (255 - Math.abs(max + min - 255));
          // on ne garde que des pixels assez colorés et ni trop sombres ni trop clairs (seuils
          // volontairement souples : un violet ou un bordeaux foncés de logo doivent passer)
          if (sat < 0.22 || light < 25 || light > 235) continue;
          var hue = 0;
          if (max !== min) {
            var d = max - min;
            if (max === r) hue = ((g - b) / d + (g < b ? 6 : 0));
            else if (max === g) hue = (b - r) / d + 2;
            else hue = (r - g) / d + 4;
            hue *= 60;
          }
          var key = Math.round(hue / 20) * 20;
          // pondère par la saturation : les pixels les plus vifs du bucket pèsent plus que les
          // pixels passés en limite basse (anticrénelage, dégradés), pour que la teinte retenue
          // reste proche de la couleur la plus pure du logo plutôt que d'une moyenne délavée.
          var weight = sat;
          if (!buckets[key]) buckets[key] = { weight: 0, r: 0, g: 0, b: 0 };
          buckets[key].weight += weight;
          buckets[key].r += r * weight; buckets[key].g += g * weight; buckets[key].b += b * weight;
        }
        var top = Object.keys(buckets).map(function (k) { return buckets[k]; })
          .sort(function (a, b) { return b.weight - a.weight; });
        if (!top.length) return;
        function avgColor(bucket) {
          return "rgb(" + Math.round(bucket.r / bucket.weight) + "," + Math.round(bucket.g / bucket.weight) + "," + Math.round(bucket.b / bucket.weight) + ")";
        }
        el.style.setProperty("--holo-a", avgColor(top[0]));
        el.style.setProperty("--holo-b", avgColor(top[1] || top[0]));
        el.style.setProperty("--holo-c", avgColor(top[2] || top[0]));
        el.classList.add("holo-from-logo");
      } catch (err) {
        // canvas potentiellement "tainted" ou autre souci : on garde silencieusement la palette
        // dorée par défaut plutôt que de faire planter l'ouverture.
      }
    };
    img.onerror = function () {
      // image introuvable/non chargée : on ne fait rien, le CSS retombe sur la palette dorée.
    };
    img.src = card.logo;
  }

  function buildRevealCard(card, onTap) {
    var el = document.createElement("div");
    el.className = "reveal-card";
    el.dataset.rarity = card.rarity;
    // disposition "fiche TCG" : header (nom/genre + PV=influence), art, attaque (titre phare + annee),
    // bio courte a la place de la 2e attaque, pied (rarete + pays/vues).
    // sans photo reelle : fond genere a partir de la palette du genre (coherent avec le logo
    // genere), au lieu du simple monogramme neutre d'avant.
    var genColors = genreHolo(card.genre);
    var fallbackPhotoHtml =
      '<div class="rc-photo-fallback" style="background: radial-gradient(ellipse 80% 70% at 50% 40%, ' +
      genColors[0] + '33, ' + genColors[1] + '); color: ' + genColors[0] + ';">' +
      card.name.split(" ").map(function (w) { return w[0]; }).slice(0, 2).join("") + '</div>';
    // une URL distante (Wikipedia) peut echouer au chargement cote navigateur meme si l'API a
    // bien repondu (image retiree depuis, hotlink bloque, etc.) : un handler onerror attache
    // plus bas (apres l'injection du HTML) bascule alors sur le meme fallback genere plutot que
    // de laisser l'icone "image cassee" du navigateur. Pas de onerror inline en attribut HTML ici
    // (fragile a echapper avec des guillemets/apostrophes dans les donnees) : on utilise un
    // addEventListener classique une fois l'element attache au DOM.
    var photoHtml = card.photo
      ? '<img class="rc-photo-img" src="' + card.photo + '" alt="" decoding="async"><div class="rc-photo-tint"></div>'
      : fallbackPhotoHtml;
    // le logo du groupe (reel ou genere) s'affiche dans le header, a la place du nom en texte,
    // avec la pastille de rarete a sa gauche. meme garde-fou : si card.logo (reel) echoue au
    // chargement, on bascule sur le logo genere plutot que l'icone cassee (cf. plus bas).
    var logoSrc = card.logo || genBandLogo(card);
    var generatedLogoSrc = genBandLogo(card);
    var headIdHtml = '<img class="rc-head-logo" src="' + logoSrc + '" alt="' + card.name + '" decoding="async">';
    // relief metallicss sur la pastille de rarete, sauf commune (pas de texture pour le palier le plus bas)
    var rarityLabelClass = card.rarity === "commune" ? "rc-rarity-label" : "rc-rarity-label metallicss";
    // cadre : .rc-frame contient .rc-window a l'interieur de son padding, comme un vrai encadrement
    // de carte a collectionner plutot qu'un simple filet. Seule la Legendaire garde le relief
    // metallicss + l'habillage holographique ; les autres raretes ont un cadre classique sobre
    // (degrade sombre teinte + grain + coins ornementaux, en CSS pur sur .rc-frame).
    var frameClass = card.rarity === "legendaire" ? "rc-frame metallicss" : "rc-frame";
    el.innerHTML =
      '<div class="' + frameClass + '">' +
      '<div class="rc-window">' +
        '<div class="rc-head">' +
          '<div class="rc-head-id">' +
            '<div class="rc-head-id-row">' +
              '<div class="' + rarityLabelClass + '">' + RARITY_LABEL[card.rarity] + '</div>' +
              headIdHtml +
            '</div>' +
          '</div>' +
          '<div class="rc-hp"><span class="rc-hp-lbl">PV</span><span class="rc-hp-num">' + card.influence + '</span></div>' +
        '</div>' +
        '<div class="rc-photo">' + photoHtml + '</div>' +
        '<div class="rc-move-top">' +
          '<span class="rc-move-band">' + card.name + '</span>' +
          '<span class="rc-move-name">' + card.genre + ' <span class="rc-move-year">(' + card.founded + ')</span></span>' +
        '</div>' +
        '<div class="rc-moves">' +
          '<div class="rc-bio">' + card.bio + '</div>' +
          (card.hit
            ? '<div class="rc-move rc-move-bonus">' +
                '<span class="rc-move-lbl">Attaque bonus</span>' +
                '<span class="rc-move-row">' +
                  '<span class="rc-move-name">' + card.hit.title + ' <span class="rc-move-year">(' + card.hit.year + ')</span></span>' +
                  '<span class="rc-move-pts">+' + Math.round(card.influence / 10) + '</span>' +
                '</span>' +
              '</div>'
            : '') +
        '</div>' +
        '<div class="rc-atk"><span class="rc-atk-lbl">ATK</span><span class="rc-atk-num">' + Math.round(card.influence / 5) + '</span></div>' +
      '</div>' +
      '</div>';

    // garde-fou de chargement : une image distante (card.photo via Wikipedia, ou un card.logo
    // reel futur) peut echouer cote navigateur meme apres une reponse API correcte (image
    // retiree depuis, hotlink bloque, etc.). On bascule alors sur le fallback genere plutot que
    // de laisser l'icone "image cassee" du navigateur visible sur la carte.
    var photoImgEl = el.querySelector(".rc-photo-img");
    if (photoImgEl) {
      photoImgEl.addEventListener("error", function () {
        var photoContainer = el.querySelector(".rc-photo");
        if (photoContainer) photoContainer.innerHTML = fallbackPhotoHtml;
      }, { once: true });
    }
    if (card.logo) {
      var logoImgEl = el.querySelector(".rc-head-logo");
      if (logoImgEl) {
        logoImgEl.addEventListener("error", function () {
          logoImgEl.src = generatedLogoSrc;
        }, { once: true });
      }
    }

    var isDragging = false, startX = 0, startY = 0, curRX = 0, curRY = 0;
    function applyTilt(dx, dy) {
      curRY = Math.max(-18, Math.min(18, dx * 0.12));
      curRX = Math.max(-18, Math.min(18, -dy * 0.12));
      el.style.transform = "rotateX(" + curRX + "deg) rotateY(" + curRY + "deg) scale(1)";
      el.style.setProperty("--holo-angle", (curRY * 6 + curRX * 6) + "deg");
    }
    function resetTilt() {
      curRX = 0; curRY = 0;
      el.style.transform = "rotateX(0deg) rotateY(0deg) scale(1)";
      el.style.setProperty("--holo-angle", "0deg");
    }
    el.addEventListener("pointerdown", function (e) {
      isDragging = true; startX = e.clientX; startY = e.clientY;
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove", function (e) {
      if (!isDragging) return;
      applyTilt(e.clientX - startX, e.clientY - startY);
    });
    el.addEventListener("pointerup", function (e) {
      var moved = Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY);
      isDragging = false;
      resetTilt();
      if (moved < 8) (onTap || nextCard)();
    });
    el.addEventListener("pointercancel", function () { isDragging = false; resetTilt(); });

    if (card.rarity === "legendaire") applyLogoHolo(el, card);

    // garde-fou anti-débordement : la bio + l'attaque bonus ne sont jamais tronquées (texte
    // intégral, pas de scroll — cf. commentaire sur .rc-moves), mais leur hauteur combinée peut
    // dépasser l'espace réellement disponible sous la photo pour un groupe à bio longue, ce qui
    // pousse le bloc "attaque bonus" hors de .rc-window (coupé par son overflow:hidden) ou lui
    // fait chevaucher la pastille ATK ancrée en absolu. Plutôt que de couper le texte, on réduit
    // progressivement la taille de police de la bio (seule la bio : l'attaque bonus et l'ATK
    // gardent une taille fixe et lisible) jusqu'à ce que tout rentre, avec un plancher qui reste
    // lisible. N'a aucun effet sur les cartes dont le contenu tient déjà (immense majorité) :
    // la boucle sort dès le premier essai si rien ne déborde.
    requestAnimationFrame(function () { fitCardMoves(el); });

    return el;
  }

  function fitCardMoves(el) {
    var win = el.querySelector(".rc-window");
    var bioEl = el.querySelector(".rc-bio");
    if (!win || !bioEl) return;
    var lastBlock = el.querySelector(".rc-move-bonus") || bioEl;
    function overflowPx() {
      return lastBlock.getBoundingClientRect().bottom - win.getBoundingClientRect().bottom;
    }
    // palier 1 : réduire la taille de police de la bio (seule la bio — l'attaque bonus et
    // l'ATK gardent une taille fixe et lisible), jusqu'à un plancher de lisibilité.
    var MIN_FONT = 10.5;
    var size = 12;
    bioEl.style.fontSize = size + "px";
    for (var i = 0; i < 12 && overflowPx() > 0 && size > MIN_FONT; i++) {
      size -= 0.5;
      bioEl.style.fontSize = size + "px";
    }
    // palier 2 : si ça déborde encore au plancher (bio très longue + attaque bonus), resserrer
    // l'interligne de la bio (gain discret, texte toujours intégralement lisible, juste plus
    // compact) avant de toucher à quoi que ce soit d'autre.
    var lineHeight = 1.36;
    for (var j = 0; j < 8 && overflowPx() > 0 && lineHeight > 1.08; j++) {
      lineHeight -= 0.04;
      bioEl.style.lineHeight = lineHeight.toFixed(2);
    }
    // palier 3 (dernier recours) : si un résidu subsiste malgré les deux paliers précédents,
    // resserrer le padding vertical entre bio et attaque bonus plutôt que de laisser déborder.
    for (var k = 0; k < 6 && overflowPx() > 0; k++) {
      var cur = parseFloat(getComputedStyle(bioEl).paddingBottom) || 7;
      bioEl.style.paddingBottom = Math.max(0, cur - 1.5) + "px";
    }
  }

  function updateProgressDots() {
    var dots = progressEl.querySelectorAll(".op-dot");
    dots.forEach(function (d, i) { d.classList.toggle("filled", i <= pullIndex); });
  }

  closeBtn.addEventListener("click", function () {
    opening.hidden = true;
  });
})();
</script>

            ...dims,

          },

        tag("rect", {

            fill,

        tag("rect", {
          props: {

      url,

      ry =
        parseInt((x / 2 < radius ? 1024 * (x / y) : radius * (2048 / y)) / 4) -

    if (x === 0 || y === 0) return;
    if (rx < 0) rx = 0;
    if (ry < 0) ry = 0;

      canvas.height = isFirefox ? 512 : y * 2 > 1024 ? 1024 : y * 2;

        context.drawImage(this, 0, 0);
        domUrl.revokeObjectURL(url);
        tempImage.remove();
      }, 0);

// Initialise un élément .metallicss donné : styles de base + observers + premier rendu.
// Exposée sur window.applyMetallicss pour les éléments créés dynamiquement après le
// scan initial (ex. cartes injectées par renderGrid() dans l'app) — le scan au chargement
// ci-dessous ne voit que ce qui existe déjà au DOMContentLoaded.
function initMetallicss(elem) {
  if (elem.dataset.metallicssInit) return; // évite une double init si rappelé par erreur
  elem.dataset.metallicssInit = "1";
  elem.style.boxShadow = "#00000030 1px 2px 2px, #00000020 2px 4px 4px";
  elem.style.color = "black";
  elem.style.textShadow = "white 0 0.5px 0";
  elem.style.overflow = "hidden";
  elem.style.textRendering = "geometricPrecision";
  elem.style.transform = "translateZ(0)";

  const debounced = debounce(metallicss),
    observer = new MutationObserver(() => debounced(elem)),
    dimensionsObserver = new ResizeObserver(() => debounced(elem));

  observer.observe(elem, { attributes: true, attributeFilter: ["style"] });
  dimensionsObserver.observe(elem);
  debounced(elem);
}
window.applyMetallicss = initMetallicss;

((fn) => {
  if (document.readyState !== "loading") fn();
  else document.addEventListener("DOMContentLoaded", fn);
})(() => {
  Array.from(document.querySelectorAll(".metallicss")).forEach(initMetallicss);
});
